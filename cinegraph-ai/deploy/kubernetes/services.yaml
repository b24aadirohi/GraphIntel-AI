apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cinegraph
spec:
  replicas: 2
  selector: &id002
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: cinegraph-ai:local
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - cinegraph.api.app:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        - --limit-concurrency
        - '64'
        envFrom:
        - configMapRef:
            name: cinegraph-config
        - secretRef:
            name: cinegraph-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 6
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /live
            port: 8000
            httpHeaders: &id001
            - name: Host
              value: localhost
          failureThreshold: 30
          periodSeconds: 5
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
            httpHeaders: *id001
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *id002
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cinegraph
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
