apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cinegraph
spec:
  replicas: 2
  selector: &id001
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: cinegraph-ai:local
        imagePullPolicy: IfNotPresent
        command:
        - python
        - manage.py
        - sync_graph
        - --watch
        envFrom:
        - configMapRef:
            name: cinegraph-config
        - secretRef:
            name: cinegraph-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - manage.py
            - worker_health
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - python
            - manage.py
            - worker_health
            - --max-age
            - '180'
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: *id001
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
