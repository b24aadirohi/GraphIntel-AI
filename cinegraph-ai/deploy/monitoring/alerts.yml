groups:
  - name: cinegraph
    rules:
      - alert: GraphIntelApiUnavailable
        expr: up{job="cinegraph-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "GraphIntel API metrics unavailable; check readiness and service credentials"}
      - alert: GraphIntelHighErrorRate
        expr: sum(rate(cinegraph_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(cinegraph_http_requests_total[5m])), 0.01) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of GraphIntel API requests fail"}
      - alert: GraphIntelHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(cinegraph_http_request_duration_seconds_bucket{route!="/chat"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Non-chat API p95 latency exceeds one second"}
