<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — GraphIntel</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="login-page"><main class="login-panel"><p class="eyebrow">GRAPHINTEL / DATA ANALYTICS & CONVERSATIONAL INTELLIGENCE</p><h1>Welcome to<br><em>GraphIntel AI.</em></h1><p class="hero-copy">Sign in to explore connected data, inspect AI evidence and access permitted analytics.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="150" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="4096" required><button type="submit">Sign in ↗</button></form><p class="muted">Ask your catalog administrator for an account.</p></main></body></html>
